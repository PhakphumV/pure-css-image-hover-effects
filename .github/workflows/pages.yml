# Deploys the generated static site (dist/) to GitHub Pages.
#
# Flow:
#   git push → checkout → npm ci → npm run check → npm run build
#           → upload dist/ as Pages artifact → deploy to Pages
#
# The build step is gated by `npm run check`, so any catalog or
# verification failure causes the workflow to fail before the
# artifact is uploaded, and the live site is never deployed
# from a known-broken source.
#
# Requires the repo's Pages source to be set to "GitHub Actions"
# (Settings → Pages → Source). Once that is set, every push to
# main rebuilds and redeploys dist/ atomically.
#
# Concurrency group "pages" prevents overlapping deploys from
# racing each other; older in-progress runs are not cancelled
# because we never want a partially-deployed site.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]

# Required so the workflow can publish a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent overlapping deploys.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # The project has zero runtime dependencies; `npm ci` is
        # used for parity with package-lock workflows and to make
        # a future dependency addition behave correctly.
        run: npm ci || npm install

      - name: Validate catalog and verify generated output
        # Fails the workflow on any catalog drift, catalogue
        # section drift in index.html/README.md, or dist/ drift.
        # No deployment happens unless this passes.
        run: npm run check

      - name: Build dist/
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
