name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate effects against CONTRACT.md and meta schema
        run: python3 scripts/validate_effects.py
      - name: Regenerate catalog (byte-determinism check)
        run: |
          cp index.html /tmp/before.html
          python3 scripts/build_catalog.py
          diff -q /tmp/before.html index.html && echo "catalog: deterministic OK"
