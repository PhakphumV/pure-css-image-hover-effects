<!DOCTYPE html>
<!--
  Effect page template — every effect page must follow this structure.
  Replace every placeholder marked {{...}} when creating a new effect page.

  Placeholders:
    {{EFFECT_NAME}}   display name, e.g. Zoom In
    {{SLUG}}          kebab-case slug, e.g. zoom-in
    {{CATEGORY}}      category name, e.g. zoom
    {{DESCRIPTION}}   one-line description of the effect
    {{IMAGE_SEED}}    picsum seed, use the slug
    {{HTML_SNIPPET}}  escaped usage snippet for the effect
    {{CSS_SNIPPET}}   escaped CSS from the category file for this effect

  CSS loading: each category ships ONE shared stylesheet named
  {{CATEGORY}}.css inside the category folder (sibling of this
  effect page), so the link below resolves to {{CATEGORY}}.css
  (e.g. zoom/zoom.css when this template is filled for an effect
  under effects/zoom/).

  Layout: two equal columns (50/50) via .detail in template.css.
    Left column  = live preview stage.
    Right column = HTML and CSS snippets (VS Code dark+ colours via highlight.js vs2015).
-->
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{EFFECT_NAME}} &middot; Pure CSS Image Hover Effects</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/vs2015.min.css">
<link rel="stylesheet" href="../template.css">
<link rel="stylesheet" href="{{CATEGORY}}.css">
<script defer src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>

<header class="container">
  <nav aria-label="Breadcrumb">
    <ul>
      <li><a href="../../index.html">&larr; Back to gallery</a></li>
    </ul>
  </nav>
  <hgroup>
    <h1>{{EFFECT_NAME}}</h1>
    <p>{{DESCRIPTION}}</p>
  </hgroup>
</header>

<main class="container">
  <div class="detail">

    <section class="preview" aria-label="Live preview">
      <div class="preview-stage">
        <div class="hover-effect {{SLUG}}">
          <img src="https://picsum.photos/seed/{{IMAGE_SEED}}/800/600" alt="{{EFFECT_NAME}} demo">
        </div>
      </div>
      <p class="preview-hint">Hover or focus the image to see the effect.</p>
    </section>

    <section aria-label="Source code">
      <h3>HTML</h3>
      <div class="code-block">
        <pre><code class="language-html">{{HTML_SNIPPET}}</code></pre>
      </div>

      <h3>CSS</h3>
      <div class="code-block">
        <pre><code class="language-css">{{CSS_SNIPPET}}</code></pre>
      </div>

      <p class="copy-hint"><small>Select the code and copy with <kbd>Ctrl+C</kbd> or <kbd>&#8984;C</kbd>.</small></p>
    </section>

  </div>
</main>

<footer class="container">
  <small><a href="../../index.html">Pure CSS Image Hover Effects</a> &middot; No JavaScript &middot; MIT</small>
</footer>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    hljs.highlightAll();
  });
</script>

</body>
</html>
