<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoom Out — Pure CSS Image Hover Effects</title>
  <link rel="stylesheet" href="../../styles/base.css">
  <link rel="stylesheet" href="./effect.css">
</head>
<body>
  <header class="page-header">
    <a href="../../index.html" class="back-link">← Back to Catalog</a>
    <h1>Zoom Out</h1>
    <p class="effect-description">Zoom hover effect on the image.</p>
  </header>

  <main>
    <section class="panel">
      <h2>Preview</h2>
      <div class="preview-container">
        <div class="hover-effect zoom-out">
          <img src="https://picsum.photos/600/400" alt="Demo image">
        </div>
      </div>
      <p class="preview-hint">Hover or focus the image to see the effect.</p>
    </section>

    <section class="panel">
      <h2>Usage</h2>
      <p>Copy this snippet into your page:</p>
      <pre class="code-block"><code>&lt;div class="hover-effect zoom-out"&gt;
  &lt;img src="your-image.jpg" alt=""&gt;
&lt;/div&gt;</code></pre>
      <p>Include <code>styles/base.css</code> and this effect's <code>effect.css</code>.</p>
    </section>
  </main>
</body>
</html>
